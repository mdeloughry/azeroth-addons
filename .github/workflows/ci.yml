name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  backend:
    name: Backend (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.11 is what Decky Loader bundles; 3.13 proves forward compatibility.
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test dependencies
        run: python -m pip install --upgrade pip -r requirements-dev.txt
      - name: Run the test suite
        run: python -m pytest -q
      - name: Validate source versions and changelog
        run: python scripts/check-release.py

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck and build
        run: pnpm run validate

  package:
    name: Release artefact
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Fetch the pinned engine and verify its checksum
        run: ./scripts/fetch-instawow.sh
      - name: Verify the bundled engine starts
        run: bin/instawow --version
      - name: Build the plugin archive
        run: ./scripts/package-release.sh
      - name: Upload the plugin archive
        uses: actions/upload-artifact@v4
        with:
          name: azeroth-addons-plugin
          path: release/*.zip
          if-no-files-found: error
